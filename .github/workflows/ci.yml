name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Claude attribution trailers
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}"
          else
            RANGE="$BASE..${{ github.sha }}"
          fi
          if git log "$RANGE" --format=%B | grep -Ei "Co-Authored-By:.*Claude|Claude-Session:"; then
            echo "::error::A commit message contains a Claude attribution trailer, which CLAUDE.md forbids."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm and verify runtime
        run: |
          npm install --global npm@12.2.0
          test "$(node --version)" = "v$(cat frontend/.node-version)"
          test "$(npm --version)" = "12.2.0"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend and schema checks
        working-directory: frontend
        run: npm run check

  frontend-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm and verify runtime
        run: |
          npm install --global npm@12.2.0
          test "$(node --version)" = "v$(cat frontend/.node-version)"
          test "$(npm --version)" = "12.2.0"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Run browser checks
        working-directory: frontend
        run: npm run test:e2e

      - name: Preserve browser failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-image:
    needs: [lint, test, frontend-check, frontend-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Build and publish image
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" .
          docker push "$image"
          digest_image="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'image=%s\n' "$digest_image" >> "$GITHUB_OUTPUT"
          {
            printf 'Published commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Image tag: `%s`\n\n' "$image"
            printf 'Digest reference: `%s`\n' "$digest_image"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ec2:
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Assume the EC2 deployment role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
          role-session-name: huginn-deploy-${{ github.run_id }}

      - name: Pull and deploy through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
          EC2_DEPLOY_TAG_VALUE: ${{ vars.EC2_DEPLOY_TAG_VALUE || 'huginn-production' }}
          EC2_DEPLOY_USER: ${{ vars.EC2_DEPLOY_USER || 'ubuntu' }}
          EC2_DEPLOY_PATH: ${{ vars.EC2_DEPLOY_PATH || '/home/ubuntu/Huginn' }}
          PUBLISHED_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          python3 scripts/dispatch-ec2-deployment.py \
            --region "$AWS_REGION" --tag-value "$EC2_DEPLOY_TAG_VALUE" \
            --user "$EC2_DEPLOY_USER" --path "$EC2_DEPLOY_PATH" \
            --commit "$GITHUB_SHA" --image "$PUBLISHED_IMAGE"
