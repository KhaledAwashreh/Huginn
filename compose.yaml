name: huginn

x-app-environment: &app-environment
  HUGINN_DATABASE_URL: postgresql://huginn:${POSTGRES_PASSWORD:?Run python3 scripts/configure-compose.py first}@db:5432/huginn
  HUGINN_MANAGEMENT_DATABASE_URL: postgresql://huginn:${POSTGRES_PASSWORD:?Run python3 scripts/configure-compose.py first}@db:5432/huginn
  HUGINN_MATCHMAKING_DATABASE_URL: postgresql://huginn:${POSTGRES_PASSWORD:?Run python3 scripts/configure-compose.py first}@db:5432/huginn
  HUGINN_MANAGEMENT_ENVIRONMENT: ${HUGINN_MANAGEMENT_ENVIRONMENT:-local}
  HUGINN_LIFECYCLE_PROOF_KEY: ${HUGINN_LIFECYCLE_PROOF_KEY:?Run python3 scripts/configure-compose.py first}
  HUGINN_WEB_ORIGIN: ${HUGINN_WEB_ORIGIN:-http://localhost:8080}
  HUGINN_SMTP_HOST: ${HUGINN_SMTP_HOST:-mailpit}
  HUGINN_SMTP_PORT: ${HUGINN_SMTP_PORT:-1025}
  HUGINN_SMTP_TLS: ${HUGINN_SMTP_TLS:-none}
  HUGINN_SMTP_USERNAME: ${HUGINN_SMTP_USERNAME:-}
  HUGINN_SMTP_PASSWORD: ${HUGINN_SMTP_PASSWORD:-}
  HUGINN_SMTP_SENDER: ${HUGINN_SMTP_SENDER:-no-reply@huginn.local}
  HUGINN_YC_ALGOLIA_API_KEY: ${HUGINN_YC_ALGOLIA_API_KEY:-}
  HUGINN_OPENCORPORATES_API_TOKEN: ${HUGINN_OPENCORPORATES_API_TOKEN:-}

x-app: &app
  image: ${HUGINN_IMAGE:-huginn-app:local}
  build: .
  environment: *app-environment
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy
    admin-seed:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huginn
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure-compose.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema:/schema:ro
      - ./docker/postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U huginn -d huginn &&
          test "$$(psql -U huginn -d huginn -Atc
          "SELECT to_regclass('operational.weekly_digest_deliveries') IS NOT NULL")" = t
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  admin-seed:
    <<: *app
    restart: "no"
    command: ["python", "/app/docker/seed-admin.py"]
    environment:
      HUGINN_MANAGEMENT_DATABASE_URL: postgresql://huginn:${POSTGRES_PASSWORD:?Run setup first}@db:5432/huginn
      HUGINN_BOOTSTRAP_ADMIN_USERNAME: ${HUGINN_BOOTSTRAP_ADMIN_USERNAME:-Khaled}
      HUGINN_BOOTSTRAP_ADMIN_EMAIL: ${HUGINN_BOOTSTRAP_ADMIN_EMAIL:-khaled@huginn.local}
      HUGINN_BOOTSTRAP_ADMIN_PASSWORD: ${HUGINN_BOOTSTRAP_ADMIN_PASSWORD:?Generate private admin credentials first}
      HUGINN_BOOTSTRAP_SECOND_ADMIN_USERNAME: ${HUGINN_BOOTSTRAP_SECOND_ADMIN_USERNAME:-Craig}
      HUGINN_BOOTSTRAP_SECOND_ADMIN_EMAIL: ${HUGINN_BOOTSTRAP_SECOND_ADMIN_EMAIL:-craig@huginn.local}
      HUGINN_BOOTSTRAP_SECOND_ADMIN_PASSWORD: ${HUGINN_BOOTSTRAP_SECOND_ADMIN_PASSWORD:?Run python3 scripts/configure-compose.py --add-admin first}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    environment:
      <<: *app-environment
      FORWARDED_ALLOW_IPS: ${HUGINN_PROXY_IP:-172.30.255.2}
    networks:
      default:
      ingress:
    ports:
      - "${HUGINN_BIND_ADDRESS:-127.0.0.1}:${HUGINN_HOST_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  traefik:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    profiles: ["https"]
    entrypoint: ["/bin/sh", "/etc/traefik/dynamic/start.sh"]
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.web.forwardedheaders.insecure=false
      - --entrypoints.websecure.forwardedheaders.insecure=false
      - --entrypoints.health.address=127.0.0.1:8888
      - --ping=true
      - --ping.entrypoint=health
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    environment:
      HUGINN_DOMAIN: ${HUGINN_DOMAIN:-}
      HUGINN_DOMAIN_ALIAS: ${HUGINN_DOMAIN_ALIAS:-}
      HUGINN_ACME_EMAIL: ${HUGINN_ACME_EMAIL:-}
      HUGINN_ACME_ENVIRONMENT: ${HUGINN_ACME_ENVIRONMENT:-production}
      HUGINN_PROXY_IP: ${HUGINN_PROXY_IP:-172.30.255.2}
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      ingress:
        ipv4_address: ${HUGINN_PROXY_IP:-172.30.255.2}
    volumes:
      - ./docker/traefik:/etc/traefik/dynamic:ro
      - certificates-production:/certificates/production
      - certificates-staging:/certificates/staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=health", "--entrypoints.health.address=127.0.0.1:8888"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mail-worker:
    <<: *app
    command: ["python", "-m", "huginn.management.presentation.cli.lifecycle_mail_worker", "--poll-seconds", "2"]

  collection-worker:
    <<: *app
    command: ["python", "-m", "huginn.pipeline_control", "worker"]

  matching-worker:
    <<: *app
    command: ["python", "-m", "huginn.matchmaking_control", "worker"]

  mailpit:
    image: axllent/mailpit:v1.27.10
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail-data:/data
    ports:
      - "127.0.0.1:${HUGINN_MAILBOX_PORT:-8026}:8025"
    restart: unless-stopped

  weekly-digest:
    <<: *app
    profiles: ["jobs"]
    restart: "no"
    entrypoint: ["python", "-m", "huginn.management.weekly_digest"]
    command: ["send", "--dry-run"]

volumes:
  postgres-data:
  mail-data:
  certificates-production:
  certificates-staging:

networks:
  ingress:
    ipam:
      config:
        - subnet: ${HUGINN_INGRESS_SUBNET:-}
          ip_range: ${HUGINN_INGRESS_DYNAMIC_RANGE:-}
